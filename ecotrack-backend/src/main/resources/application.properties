# ============================================================
# EcoTrack Backend  application.properties
# SETUP: Change spring.datasource.password before running.
# ============================================================

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT (change secret before deploying)
app.jwt.secret=ecotrack_super_secret_key_for_jwt_2024_change_in_production_minimum_256_bits
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.ecotrack=INFO
logging.level.org.springframework.security=WARN
